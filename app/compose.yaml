x-app: &app
  build: .
  environment:
    DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-quotes}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-quotes}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotes}
      POSTGRES_USER: ${POSTGRES_USER:-quotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  init-db:
    <<: *app
    command: ["python", "-m", "app.init_db"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init-db:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
